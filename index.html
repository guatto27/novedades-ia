:root{--bg:#0A0E17;--cy:#22D3EE;--vi:#A78BFA;--am:#FBBF24;--tx:#E6EDF7;--mut:#9FB0C8;
 --tf:'MontE','Montserrat','Segoe UI','Helvetica Neue',Arial,sans-serif;--bf:'InterE','Inter','Segoe UI',Roboto,Arial,sans-serif;
 --padx:clamp(18px,5.6vw,110px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050a;overflow:hidden;color:var(--tx);font-family:var(--bf);-webkit-tap-highlight-color:transparent}
a{color:inherit}
#stage{position:fixed;inset:0;overflow:hidden;
 background:radial-gradient(ellipse 70% 60% at 50% 52%,#101b33 0%,#0A0E17 62%,#070a12 100%)}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grid{position:absolute;inset:-60px;pointer-events:none;
 background-image:linear-gradient(rgba(34,211,238,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.055) 1px,transparent 1px);
 background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 55%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 60% 55% at 50% 55%,#000 20%,transparent 80%);
 animation:gridmove 24s linear infinite}
@keyframes gridmove{to{transform:translate(60px,60px)}}
.glowblob{position:absolute;width:min(900px,120vw);height:min(900px,120vw);left:50%;top:50%;margin:calc(min(900px,120vw)/-2) 0 0 calc(min(900px,120vw)/-2);border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(59,130,246,.10),rgba(167,139,250,.05) 40%,transparent 70%);animation:blob 14s ease-in-out infinite alternate}
@keyframes blob{from{transform:translate(-80px,-20px) scale(1)}to{transform:translate(80px,30px) scale(1.12)}}

/* ── barra superior: filtros ── */
.topbar{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:16px;
 padding:calc(14px + env(safe-area-inset-top)) var(--padx) 12px;background:linear-gradient(180deg,rgba(7,10,18,.92),rgba(7,10,18,.55) 70%,transparent)}
.topbar .brand{font:800 14px var(--tf);letter-spacing:.22em;color:#CFE9F6;white-space:nowrap;display:flex;align-items:center}
.topbar .brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);margin-right:12px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:auto;padding:2px}
.filters::-webkit-scrollbar{display:none}
.chipf{flex:0 0 auto;cursor:pointer;padding:7px 14px;border-radius:999px;font:600 14px var(--bf);color:#C8D5E7;
 background:rgba(255,255,255,.04);border:1px solid rgba(160,236,255,.2);transition:all .25s}
.chipf:hover{border-color:rgba(34,211,238,.6);color:#fff}
.chipf .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--c,var(--cy));box-shadow:0 0 8px var(--c,var(--cy))}
.chipf .n{opacity:.6;margin-left:6px;font-weight:500}
.chipf.on{color:#061018;background:var(--c,var(--cy));border-color:var(--c,var(--cy));box-shadow:0 0 18px color-mix(in srgb,var(--c,var(--cy)) 55%,transparent)}
.chipf.on .dot{background:#061018;box-shadow:none}

/* ── diapositivas ── */
#deck{position:absolute;inset:0}
.slide{position:absolute;inset:0;visibility:hidden;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
 padding:calc(86px + env(safe-area-inset-top)) var(--padx) calc(96px + env(safe-area-inset-bottom));scrollbar-width:thin;scrollbar-color:rgba(34,211,238,.3) transparent}
.slide.active{visibility:visible}
.kicker{font:700 clamp(12px,1.05vw,19px) var(--tf);letter-spacing:.32em;color:var(--cy);text-shadow:0 0 14px rgba(34,211,238,.6);text-transform:uppercase}
.head h1{margin:10px 0 6px;font:800 clamp(30px,3.4vw,60px)/1.04 var(--tf);text-transform:uppercase;letter-spacing:.01em;
 background:linear-gradient(90deg,#fff 0%,#dff8ff 55%,#9ee9ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px rgba(34,211,238,.35))}
.head .sub{font:400 clamp(16px,1.4vw,26px) var(--bf);color:var(--mut)}

/* ── portada ── */
.cover-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:4vw}
.cover .kicker{letter-spacing:.24em}
.mega{margin:22px 0 14px;font:900 clamp(52px,7.1vw,136px)/0.95 var(--tf);letter-spacing:-.01em;color:#fff;text-shadow:0 0 40px rgba(34,211,238,.45),0 0 90px rgba(34,211,238,.2)}
.mega span{color:var(--cy);display:block}
.cover-sub{font:600 clamp(17px,1.6vw,30px)/1.25 var(--tf);color:#CFE9F6;text-transform:uppercase;letter-spacing:.04em}
.cover-line{margin:30px 0 26px;width:180px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 16px var(--cy)}
.cover-p{margin:0;font:400 clamp(16px,1.5vw,29px)/1.45 var(--bf);color:#C3D2E6}
.cover-p b{color:#fff;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
.stat{padding:14px 20px;border-radius:16px;min-width:130px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid rgba(160,236,255,.24);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 26px rgba(34,211,238,.13)}
.stat b{display:block;font:800 clamp(26px,2.4vw,42px) var(--tf);color:#fff}
.stat span{font:600 13px var(--bf);letter-spacing:.14em;color:var(--cy);text-transform:uppercase}
.stat.v span{color:var(--vi)}.stat.a span{color:var(--am)}
.cta{margin-top:30px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;padding:14px 26px;border-radius:14px;font:800 16px var(--tf);letter-spacing:.14em;text-transform:uppercase;color:#061018;
 background:linear-gradient(90deg,var(--cy),#7DD3FC);border:0;box-shadow:0 0 26px rgba(34,211,238,.45)}
.cta:hover{filter:brightness(1.1)}
.hero{display:flex;justify-content:center}
.hero svg{width:min(540px,100%);height:auto;overflow:visible}
.spin,.pulse,.pulse2,.twinkle{transform-box:fill-box;transform-origin:center}

/* ── línea de tiempo (riel) ── */
.rail{display:flex;align-items:center;gap:0;margin:26px 0 30px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.rail::-webkit-scrollbar{display:none}
.rail .stop{flex:0 0 auto;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:#6E819C;font:700 13px var(--bf);letter-spacing:.12em;text-transform:uppercase;padding:6px 4px}
.rail .stop i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(34,211,238,.5);background:#0d1426;transition:all .3s}
.rail .stop.on{color:#fff}
.rail .stop.on i{background:var(--cy);border-color:var(--cy);box-shadow:0 0 14px var(--cy)}
.rail .stop:hover{color:#CFE9F6}
.rail .seg{flex:0 0 36px;height:2px;background:linear-gradient(90deg,rgba(34,211,238,.45),rgba(167,139,250,.45));margin:0 6px}

/* ── tarjetas ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px 24px 20px 24px;border-radius:18px;
 background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid rgba(160,236,255,.24);
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 26px rgba(34,211,238,.13),0 14px 34px rgba(0,0,0,.4);transition:transform .3s,box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 34px color-mix(in srgb,var(--c) 30%,transparent),0 18px 40px rgba(0,0,0,.45)}
.card:before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 12px var(--c)}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font:800 13px var(--tf);letter-spacing:.14em;text-transform:uppercase;
 color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.num{font:700 13px var(--tf);letter-spacing:.12em;color:#56657d}
.card h3{margin:2px 0 0;font:700 clamp(18px,1.25vw,23px)/1.22 var(--tf);color:#fff;letter-spacing:.005em}
.lbl{font:700 12.5px/1.3 var(--bf);letter-spacing:.14em;color:var(--cy);text-transform:uppercase;margin-bottom:4px}
.card p{margin:0;font:400 clamp(15px,1vw,18px)/1.48 var(--bf);color:#C8D5E7}
.why{padding:12px 14px;border-radius:12px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.28)}
.why .lbl{color:var(--am)}
.why p{color:#F3E7C4}
.src{margin-top:auto;display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:7px 13px;border-radius:9px;font:600 14.5px var(--bf);color:#BFF4FF;text-decoration:none;
 background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.35);transition:background .2s}
.src:hover{background:rgba(34,211,238,.2)}
.src.none{color:#6E819C;background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.1)}

/* ── resumen ── */
.bars{display:grid;gap:14px;max-width:1100px;margin-top:34px}
.bar{display:grid;grid-template-columns:140px 1fr 46px;align-items:center;gap:16px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.bar b{font:800 15px var(--tf);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.bar .tr{height:16px;border-radius:9px;background:rgba(255,255,255,.05);overflow:hidden}
.bar .tr i{display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c));box-shadow:0 0 14px var(--c)}
.bar span{font:800 20px var(--tf);color:#fff;text-align:right}
.note{margin-top:36px;max-width:1100px;padding:16px 22px;border-radius:14px;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.35);font:400 17px/1.5 var(--bf);color:#D9DEEE}
.note b{color:#fff}
.empty{margin-top:40px;font:400 20px var(--bf);color:var(--mut)}

/* ── animaciones (solo en la diapositiva activa, se repiten al entrar) ── */
.slide:not(.active) *{animation:none!important}
.slide.active .head>*,.slide.active .cover>*{animation:inL .8s cubic-bezier(.2,.8,.2,1) both}
.slide.active .head>:nth-child(2),.slide.active .cover>:nth-child(2){animation-delay:.1s}
.slide.active .head>:nth-child(3),.slide.active .cover>:nth-child(3){animation-delay:.2s}
.slide.active .cover>:nth-child(4){animation-delay:.3s}.slide.active .cover>:nth-child(5){animation-delay:.4s}
.slide.active .cover>:nth-child(6){animation-delay:.5s}.slide.active .cover>:nth-child(7){animation-delay:.6s}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.slide.active .hero svg{animation:heroIn 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.slide.active .hero .floaty{animation:float 6s ease-in-out 1.3s infinite}
@keyframes heroIn{from{opacity:0;transform:scale(.72);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.slide.active .spin{animation:spin 36s linear infinite}
.slide.active .spin.rev{animation-direction:reverse;animation-duration:28s}
.slide.active .spin.slow{animation-duration:60s}
@keyframes spin{to{transform:rotate(360deg)}}
.slide.active .pulse{animation:pulse 3.2s ease-in-out 1.2s infinite}
@keyframes pulse{0%,100%{stroke-opacity:1;stroke-width:2.5}50%{stroke-opacity:.55;stroke-width:4}}
.slide.active .pulse2{animation:pulse2 2.8s ease-in-out 1.2s infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.slide.active .twinkle{animation:twinkle 2.4s ease-in-out 1s infinite}
.slide.active .twinkle.d2{animation-delay:1.8s}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.slide.active .rail{animation:fadeIn .8s ease-out .35s both}
.slide.active .card,.slide.active .stat,.slide.active .bar{animation:panelIn .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i) * .12s)}
@keyframes panelIn{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
.slide.active .bar .tr i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.8s + var(--i) * .12s)}
@keyframes grow{from{width:0}}
.slide.active .note,.slide.active .cta{animation:fadeUp .8s ease-out 1.2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ── pie y navegación ── */
.foot{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:14px;
 padding:14px var(--padx) calc(18px + env(safe-area-inset-bottom));font:600 15px var(--bf);letter-spacing:.14em;color:#6E819C;
 background:linear-gradient(0deg,rgba(7,10,18,.94),rgba(7,10,18,.6) 70%,transparent)}
.foot .hint{letter-spacing:.04em;font-weight:400;color:#56657d}
.foot .nav{display:flex;align-items:center;gap:12px}
.navb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--cy);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.4);transition:all .2s}
.navb:hover{background:rgba(34,211,238,.2);box-shadow:0 0 16px rgba(34,211,238,.4)}
.navb:disabled{opacity:.3;cursor:default;box-shadow:none}
.count{font:700 17px var(--tf);letter-spacing:.1em;min-width:72px;text-align:center}.count b{color:var(--cy)}
.progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.04);z-index:11}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi));box-shadow:0 0 10px var(--cy);transition:width .6s}

/* ── teléfono / pantallas chicas ── */
@media (max-width:900px){
 .cover-wrap{grid-template-columns:1fr;gap:10px;align-content:start}
 .hero{order:-1}.hero svg{width:min(240px,60vw)}
 .mega{margin-top:14px}
 .topbar{flex-wrap:wrap;gap:10px}
 .filters{margin-left:0;width:100%}
 .slide{padding-top:calc(118px + env(safe-area-inset-top))}
 .foot .hint{display:none}
 .bar{grid-template-columns:96px 1fr 34px;gap:10px}
}
@media (max-width:520px){
 .foot .brand{display:none}
 .foot{justify-content:center}
 .card{padding:18px 18px 16px}
 .stat{min-width:0;flex:1 1 28%;padding:12px 14px}
 .stat span{font-size:11px;letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="stage"><canvas id="bg"></canvas><div class="grid"></div><div class="glowblob"></div>
<header class="topbar"><span class="brand"><i></i>NOVEDADES DE IA</span><nav class="filters" id="filters" aria-label="Filtrar por empresa"></nav></header>
<main id="deck"></main>
<footer class="foot"><span class="brand">CENTINELA · NOVEDADES DE IA</span><span class="hint">← → / espacio: navegar · F: pantalla completa · Inicio / Fin</span>
<span class="nav"><button class="navb" id="prev" aria-label="Anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<span class="count"><b id="cur">01</b> / <span id="tot">01</span></span>
<button class="navb" id="next" aria-label="Siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></span></footer>
<div class="progress"><i id="prog"></i></div>
</div>
<script>(function(){
const deck=document.getElementById('deck');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const color=e=>EMPRESAS[e]||'#22D3EE';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return {y,m,d,w:new Date(Date.UTC(y,m-1,d)).getUTCDay()};};
const fLarga=s=>{const p=pd(s);return `${p.d} de ${MESES[p.m-1]} de ${p.y}`;};
const fCorta=s=>{const p=pd(s);return `${p.d} ${MESES[p.m-1].slice(0,3)}`;};
const fDia=s=>{const p=pd(s);const n=DIAS[p.w];return n[0].toUpperCase()+n.slice(1);};
const plural=(n,a,b)=>n+' '+(n===1?a:b);

// datos ordenados: fecha más nueva primero (se respeta el orden original dentro del mismo día)
const ITEMS=NOVEDADES.map((x,i)=>({...x,_i:i})).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:a._i-b._i);
const FECHAS=[...new Set(ITEMS.map(x=>x.fecha))];
const CONTEO={};ITEMS.forEach(x=>CONTEO[x.empresa]=(CONTEO[x.empresa]||0)+1);
const LISTA_EMP=Object.keys(CONTEO).sort((a,b)=>CONTEO[b]-CONTEO[a]||a.localeCompare(b));
const actualizado=ACTUALIZADO||FECHAS[0]||'';

let filtro='Todas',slides=[],N=0,cur=0;

// filtros
const fb=document.getElementById('filters');
fb.innerHTML=[['Todas',ITEMS.length,'#22D3EE'],...LISTA_EMP.map(e=>[e,CONTEO[e],color(e)])]
 .map(([e,n,c])=>`<button class="chipf${e==='Todas'?' on':''}" data-e="${esc(e)}" style="--c:${c}"><span class="dot"></span>${esc(e)}<span class="n">${n}</span></button>`).join('');
fb.addEventListener('click',ev=>{const b=ev.target.closest('.chipf');if(!b)return;setFiltro(b.dataset.e,true);});
function setFiltro(e,jump){filtro=e;fb.querySelectorAll('.chipf').forEach(b=>b.classList.toggle('on',b.dataset.e===e));
 const keepCover=cur===0&&!jump;render();show(keepCover||N<2?0:1);}

const heroSVG=`<div class="floaty"><svg viewBox="0 0 460 460" overflow="visible"><defs>
<radialGradient id="rg1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/><stop offset=".55" stop-color="#3B82F6" stop-opacity=".10"/><stop offset="1" stop-color="#0A0E17" stop-opacity="0"/></radialGradient>
<linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<linearGradient id="lv1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
<filter id="gl1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<circle cx="230" cy="230" r="250.8" fill="url(#rg1)"/>
<circle class="spin" cx="230" cy="230" r="216.6" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 11"/>
<circle class="spin rev" cx="230" cy="230" r="190" fill="none" stroke="#A78BFA" stroke-opacity=".6" stroke-width="2.2" stroke-dasharray="70 26 8 26"/>
<circle class="pulse" cx="230" cy="230" r="167.2" fill="rgba(12,22,44,.72)" stroke="#22D3EE" stroke-width="2.5" filter="url(#gl1)"/>
<g class="spin slow"><polygon points="230,72 367,151 367,309 230,388 93,309 93,151" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="1.5"/></g>
<g filter="url(#gl1)">
 <rect x="160" y="160" width="140" height="140" rx="22" fill="rgba(34,211,238,.10)" stroke="url(#lg1)" stroke-width="4"/>
 <path d="M190 160v-24M230 160v-24M270 160v-24M190 324v-24M230 324v-24M270 324v-24M160 190h-24M160 230h-24M160 270h-24M324 190h-24M324 230h-24M324 270h-24" stroke="#22D3EE" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
</g>
<g class="pulse2" filter="url(#gl1)"><path d="M230 186c5 26 18 39 44 44-26 5-39 18-44 44-5-26-18-39-44-44 26-5 39-18 44-44z" fill="#E9D5FF" stroke="url(#lv1)" stroke-width="3" stroke-linejoin="round"/></g>
<circle class="twinkle" cx="318" cy="128" r="6" fill="#CFFBFF" filter="url(#gl1)"/><circle class="twinkle d2" cx="126" cy="330" r="5" fill="#F0EAFF" filter="url(#gl1)"/>
</svg></div>`;

function card(x,i){const c=color(x.empresa);
 const src=x.fuente?`<a class="src" href="${esc(x.fuente)}" target="_blank" rel="noopener noreferrer">Ver fuente oficial <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`:`<span class="src none">Fuente oficial no disponible</span>`;
 return `<article class="card" style="--c:${c};--i:${i}"><div class="top"><span class="badge"><i></i>${esc(x.empresa)}</span><span class="num">${String(i+1).padStart(2,'0')}</span></div>
 <h3>${esc(x.titulo)}</h3><div><div class="lbl">Qué es</div><p>${esc(x.resumen)}</p></div>
 <div class="why"><div class="lbl">Por qué te importa</div><p>${esc(x.importa)}</p></div>${src}</article>`;}

function render(){
 const vis=ITEMS.filter(x=>filtro==='Todas'||x.empresa===filtro);
 const fechas=[...new Set(vis.map(x=>x.fecha))];
 const nEmp=new Set(vis.map(x=>x.empresa)).size;
 const rango=(()=>{if(!FECHAS.length)return '';const a=pd(FECHAS[FECHAS.length-1]),b=pd(FECHAS[0]);
  if(FECHAS.length===1)return `del ${fLarga(FECHAS[0])}`;
  if(a.y===b.y&&a.m===b.m)return `del ${a.d} al ${b.d} de ${MESES[b.m-1]} de ${b.y}`;
  if(a.y===b.y)return `del ${a.d} de ${MESES[a.m-1]} al ${b.d} de ${MESES[b.m-1]} de ${b.y}`;
  return `del ${fLarga(FECHAS[FECHAS.length-1])} al ${fLarga(FECHAS[0])}`;})();
 let h=`<section class="slide"><div class="cover-wrap"><div class="cover">
  <div class="kicker">Centinela · resumen para Luis Alberto</div>
  <h1 class="mega">Novedades<span>de IA</span></h1>
  <div class="cover-sub">Todo lo nuevo en inteligencia artificial, en un solo lugar</div>
  <div class="cover-line"></div>
  <p class="cover-p">Última actualización: <b>${esc(actualizado?fLarga(actualizado):'—')}</b>${rango?`<br>Noticias ${esc(rango)}`:''}</p>
  <div class="stats"><div class="stat" style="--i:0"><b>${ITEMS.length}</b><span>Novedades</span></div><div class="stat v" style="--i:1"><b>${LISTA_EMP.length}</b><span>Empresas</span></div><div class="stat a" style="--i:2"><b>${FECHAS.length}</b><span>${FECHAS.length===1?'Día':'Días'}</span></div></div>
  <div><button class="cta" data-go="1">Ver línea de tiempo <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
 </div><div class="hero">${heroSVG}</div></div></section>`;
 const rail=act=>`<div class="rail">${fechas.map((f,k)=>`${k?'<span class="seg"></span>':''}<button class="stop${f===act?' on':''}" data-go="${k+1}"><i></i>${esc(fCorta(f))}</button>`).join('')}</div>`;
 fechas.forEach((f,k)=>{const its=vis.filter(x=>x.fecha===f);
  h+=`<section class="slide"><div class="head"><div class="kicker">Línea de tiempo · ${String(k+1).padStart(2,'0')} de ${String(fechas.length).padStart(2,'0')}${filtro!=='Todas'?' · '+esc(filtro):''}</div>
  <h1>${esc(fLarga(f))}</h1><div class="sub">${esc(fDia(f))} · ${plural(its.length,'novedad','novedades')}</div></div>${rail(f)}
  <div class="cards">${its.map(card).join('')}</div></section>`;});
 if(!fechas.length)h+=`<section class="slide"><div class="head"><div class="kicker">Línea de tiempo</div><h1>Sin novedades</h1></div><p class="empty">No hay novedades de ${esc(filtro)} todavía.</p></section>`;
 const max=Math.max(1,...LISTA_EMP.map(e=>CONTEO[e]));
 h+=`<section class="slide"><div class="head"><div class="kicker">Resumen</div><h1>¿Quién anunció más?</h1><div class="sub">Novedades por empresa · toca una barra para filtrar</div></div>
  <div class="bars">${LISTA_EMP.map((e,i)=>`<button class="bar" data-f="${esc(e)}" style="--c:${color(e)};--w:${CONTEO[e]/max*100}%;--i:${i}"><b>${esc(e)}</b><span class="tr"><i></i></span><span>${CONTEO[e]}</span></button>`).join('')}</div>
  <div class="note"><b>Cómo se actualiza:</b> cada novedad nueva de la rutina «Centinela» se agrega a esta presentación y a la base <b>Novedades de IA</b> en Notion, ordenada por fecha.</div></section>`;
 deck.innerHTML=h;slides=[...deck.querySelectorAll('.slide')];N=slides.length;
 document.getElementById('tot').textContent=String(N).padStart(2,'0');
}
deck.addEventListener('click',ev=>{const g=ev.target.closest('[data-go]');if(g){ev.stopPropagation();show(+g.dataset.go);return;}
 const f=ev.target.closest('[data-f]');if(f){ev.stopPropagation();setFiltro(f.dataset.f,true);}});

function show(i){cur=Math.max(0,Math.min(N-1,i));
 slides.forEach(s=>s.classList.remove('active'));void deck.offsetWidth;
 const s=slides[cur];s.classList.add('active');s.scrollTop=0;
 document.getElementById('cur').textContent=String(cur+1).padStart(2,'0');
 document.getElementById('prog').style.width=((cur+1)/N*100)+'%';
 document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===N-1;
 history.replaceState(null,'','#'+(cur+1));}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();}
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const k=e.key;
 if(['ArrowRight','PageDown',' '].includes(k)){e.preventDefault();show(cur+1);}
 else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();show(cur-1);}
 else if(k==='Enter'&&!(e.target.closest&&e.target.closest('button,a'))){e.preventDefault();show(cur+1);}
 else if(k==='Home')show(0);else if(k==='End')show(N-1);
 else if(k==='f'||k==='F')toggleFS();});
// clic en zona vacía (solo con mouse): izquierda = atrás, derecha = adelante
deck.addEventListener('click',e=>{if(!matchMedia('(pointer:fine)').matches)return;if(e.target.closest('a,button,.card,.stat,.bar,.rail'))return;
 if(getSelection&&String(getSelection()).length)return;if(e.clientX<innerWidth*.25)show(cur-1);else show(cur+1);});
// deslizar en teléfono
let t0=null;deck.addEventListener('touchstart',e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY};},{passive:true});
deck.addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4)show(cur+(dx<0?1:-1));t0=null;},{passive:true});

// partículas de fondo (mismo efecto que la presentación de PIGOP)
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W=0,H=0;
function size(){const r=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);}
addEventListener('resize',size);size();
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const P=[...Array(70)].map(()=>({x:rnd()*1920,y:rnd()*1080,vx:(rnd()-.5)*.018,vy:(rnd()-.5)*.018-.006,r:rnd()*1.8+.5,a:rnd()*.5+.2,ph:rnd()*6.28}));
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function renderBg(){const t=reduce?0:performance.now(),sx=W/1920,sy=H/1080;cx.clearRect(0,0,W,H);
 const pts=P.map(p=>({x:(((p.x+p.vx*t)%1920+1920)%1920)*sx,y:(((p.y+p.vy*t)%1080+1080)%1080)*sy,r:p.r,a:p.a*(.6+.4*Math.sin(t/1400+p.ph))}));
 cx.lineWidth=1;
 for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;
  if(d<17000){cx.strokeStyle=`rgba(34,211,238,${(.10*(1-d/17000)).toFixed(3)})`;cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke();}}
 for(const p of pts){cx.fillStyle=`rgba(125,225,255,${p.a.toFixed(3)})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}}
function loop(){renderBg();if(!reduce)requestAnimationFrame(loop);}

const start=()=>{render();const h=parseInt(location.hash.slice(1));show(isNaN(h)?0:h-1);loop();};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
})();
</script></body></html>
